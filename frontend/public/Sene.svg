<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Define premium brand colors -->
    <style>
      .bg { fill: #fcfbf7; }
      .leaf-green { fill: #134231; }
      .accent-gold { fill: #d99a3c; }
    </style>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="100%" height="100%" class="bg" />

  <g transform="translate(20, 0)">
    <!-- LEFT SIDE: Leaf & Crop Elements (Deep Agricultural Green) -->
    <!-- Main Left Stem/Leaf Curve -->
    <path class="leaf-green" d="M 180,380 C 130,340 100,280 110,210 C 112,190 120,165 130,150 C 132,152 135,160 136,170 C 142,220 170,270 215,300 C 235,312 250,320 260,332 C 230,360 205,375 180,380 Z" />
    
    <!-- Outer Left Leaf/Shoot -->
    <path class="leaf-green" d="M 135,260 C 110,230 105,190 112,150 C 122,170 145,195 160,210 C 150,230 142,245 135,260 Z" />
    
    <!-- Center Grain Stem -->
    <path class="leaf-green" d="M 178,382 C 175,340 172,270 200,185 C 205,170 212,150 218,135 C 220,150 225,170 226,185 C 228,230 215,310 182,380 Z" />

    <!-- Center-Top Main Leaf -->
    <path class="leaf-green" d="M 218,135 C 210,110 212,85 225,60 C 238,85 240,110 232,135 C 227,130 223,130 218,135 Z" />
    
    <!-- Right Grain Husks (Alternating Up the Center Stem) -->
    <path class="leaf-green" d="M 226,175 C 238,160 252,150 262,145 C 255,165 245,185 232,200 C 229,190 228,182 226,175 Z" />
    <path class="leaf-green" d="M 222,125 C 232,110 248,102 256,98 C 250,115 240,132 228,145 C 226,138 224,132 222,125 Z" />
    
    <!-- Left Grain Husks -->
    <path class="leaf-green" d="M 210,155 C 195,145 182,132 175,122 C 185,135 198,152 205,165 C 208,160 209,157 210,155 Z" />
    <path class="leaf-green" d="M 216,105 C 204,95 192,82 186,75 C 194,88 206,102 212,112 C 215,108 215,106 216,105 Z" />

    <!-- RIGHT SIDE: Fluid Voice & Connection Waves (Warm Golden Yellow Accent) -->
    <!-- Inner Base Swirl connecting the crop to the waves -->
    <path class="accent-gold" d="M 182,382 C 190,360 205,320 238,290 C 250,280 265,272 278,270 C 265,285 250,305 240,335 C 232,360 215,385 182,382 Z" />

    <!-- Sound Wave 1 (Inner Wave) -->
    <path class="leaf-green" d="M 290,265 C 310,240 318,205 310,170 C 306,152 298,138 288,125 C 298,135 308,155 315,180 C 322,210 312,245 292,275 C 291,272 290,268 290,265 Z" />

    <!-- Sound Wave 2 (Middle Wave) -->
    <path class="accent-gold" d="M 320,290 C 348,255 358,210 348,160 C 342,130 330,105 315,85 C 330,105 345,135 352,170 C 360,215 348,268 322,305 C 321,300 320,295 320,290 Z" />

    <!-- Sound Wave 3 (Outer Wave) -->
    <path class="accent-gold" d="M 355,315 C 390,270 402,215 390,150 C 382,110 365,80 345,55 C 368,80 388,120 398,165 C 408,225 392,285 358,330 C 356,325 355,320 355,315 Z" />
  </g>
</svg>